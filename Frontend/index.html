<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123e4a" />
    <meta name="description" content="Dawfuzy: dependable water sales, stock and expense records for a growing Ghanaian family business." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Dawfuzy" />
    <!-- black-translucent is what makes iOS report real safe-area insets in standalone -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet" />
    <title>Dawfuzy: Water business</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Applied before first paint so a dark user never sees a flash of the light theme.
      // Reads the same key as use-theme.ts; keep the two in step.
      (function () {
        try {
          var pref = localStorage.getItem("dawfuzy-theme") || "system";
          if (pref === "dark" || (pref !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0f1518");
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
